{% extends 'jobs/base_jobs.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
            <h3 class="fw-bold mb-4 text-center"><i class="bi bi-box-arrow-in-right text-warning me-2"></i>Login</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 mt-3 fw-semibold">Sign In</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
