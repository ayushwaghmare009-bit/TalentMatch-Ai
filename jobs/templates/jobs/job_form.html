{% extends 'jobs/base_jobs.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
            <h3 class="fw-bold mb-4"><i class="bi bi-plus-circle text-warning me-2"></i>Post a New Job Opening</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Job Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Full Stack Developer" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Company Name</label>
                    <input type="text" name="company" class="form-control" placeholder="e.g. Acme Corp" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Location</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Remote / Pune, India" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Job Description</label>
                    <textarea name="description" rows="4" class="form-control" placeholder="Describe the role responsibilities..." required></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Requirements & Tech Stack</label>
                    <textarea name="requirements" rows="3" class="form-control" placeholder="Python, Django, React, SQL..." required></textarea>
                </div>
                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-semibold">Publish Job Listing</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
